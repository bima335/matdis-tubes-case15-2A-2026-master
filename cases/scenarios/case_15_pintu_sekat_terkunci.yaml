case_id: "case_15_pintu_sekat_jaringan_kontrol_n8"
title: "Jaringan Kontrol Pintu Sekat: Rekonfigurasi Sambungan dengan MST"
description: >
  Skenario N=8 berbasis Minimum Spanning Tree (MST), terinspirasi oleh
  laporan kebakaran rest home di Auckland pada Mei 2006. Pemetaan mengikuti
  contoh jaringan komunikasi pada Rosen (Sec. 11.5): simpul adalah panel atau
  modul kontrol pintu, sisi adalah kandidat sambungan komunikasi, dan bobot
  adalah biaya relatif sambungan. Tujuannya menghubungkan seluruh perangkat
  dengan total biaya sambungan minimum (n-1 = 7 sisi). Gangguan sambungan
  antara modul Area Tidur 1 dan Lounge dimodelkan melalui peningkatan bobot
  sisi 3-4 dari 8 menjadi 80, lalu MST dihitung ulang. Keluaran yang
  diharapkan adalah dua MST: kondisi awal (total 62) dan setelah event
  (total 72). Topologi, posisi, bobot, dan gangguan jaringan merupakan asumsi
  simulasi kelompok, bukan data hasil investigasi. MST tidak secara langsung
  membuka pintu atau menjamin keselamatan evakuasi; MST hanya memastikan
  semua modul pintu, termasuk modul pintu keluar Area 2, tetap terhubung
  dengan biaya sambungan minimum.

