execution_plan:
  start_node: 0
  goal_node: 7
  events:
    - step: 1
      type: "DYNAMIC_EDGE_WEIGHT"
      target_edge: [3, 4]
      new_weight: 80.0
      description: >
        Dalam simulasi, sambungan kontrol antara modul Area Tidur 1
        dan Lounge (sisi 3-4) mengalami gangguan sehingga bobotnya
        meningkat dari 8 menjadi 80. MST dihitung ulang dan memilih
        sambungan alternatif antara panel utama Rest Home dan modul
        Lounge (sisi 0-4). Peningkatan bobot adalah penalti biaya,
        bukan penghapusan sisi atau bukti kerusakan pada kejadian nyata.